name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: |
          cd backend
          pip install -r requirements.txt
          SYNC_PROCESSING=1 DATABASE_URL="sqlite:////tmp/visioniq_test.db" STORAGE_DIR="/tmp/visioniq_test_storage" JWT_SECRET="ci-test-secret" python -m pytest tests/ -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: cd frontend && npm ci && npm run build
