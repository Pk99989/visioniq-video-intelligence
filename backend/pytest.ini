[pytest]
markers =
    e2e: end-to-end browser tests (need live backend + frontend + worker; run with VISIONIQ_E2E=1)
    integration: needs live Postgres / Redis / Qdrant (CI service containers, or local servers); skipped when unreachable
    vlm: needs a real Ollama model server (run with VISIONIQ_VLM_E2E=1)
