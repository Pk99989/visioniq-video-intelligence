# Full stack (Phase 2, hardened Phase 12): PostgreSQL + Qdrant +
# Redis + Celery worker + backend + frontend.
#
# Single start command (from the repo root, with a .env that sets
# JWT_SECRET — see .env.example):
#   docker compose up --build -d
# The backend entrypoint waits for Postgres/Redis/Qdrant, applies
# Alembic migrations, fixes the storage volume's ownership and drops
# to the non-root `visioniq` user before starting the server.
# Check health:  docker compose ps   (all services should be healthy)
#                 curl localhost:8000/health
# Stop:           docker compose down   (volumes are kept)
# Full reset:     docker compose down -v   (DELETES all data)
services:
  postgres:
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_USER: visioniq
      POSTGRES_PASSWORD: visioniq
      POSTGRES_DB: visioniq
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visioniq"]
      interval: 5s
      timeout: 5s
      retries: 10
  qdrant:
    restart: unless-stopped
    # Phase 12: pinned (was :latest — an unpinned vector DB is a
    # silent schema/upgrade risk).
    image: qdrant/qdrant:v1.20.0
    volumes:
      - qdrantdata:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    restart: unless-stopped
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://visioniq:visioniq@postgres:5432/visioniq
      QDRANT_URL: http://qdrant:6333
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      WORKER_MODE: celery
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fastembed}
      VLM_PROVIDER: ${VLM_PROVIDER:-fallback}
      VLM_BASE_URL: ${VLM_BASE_URL:-}
      VLM_MODEL: ${VLM_MODEL:-}
      VLM_API_KEY: ${VLM_API_KEY:-}
    volumes:
      - backend_storage:/app/storage
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
  worker:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.services.celery_app.celery_app worker --loglevel=info --concurrency=1
    environment:
      DATABASE_URL: postgresql://visioniq:visioniq@postgres:5432/visioniq
      QDRANT_URL: http://qdrant:6333
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      WORKER_MODE: celery
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fastembed}
    volumes:
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy
volumes:
  pgdata:
  qdrantdata:
  redisdata:
  backend_storage:
