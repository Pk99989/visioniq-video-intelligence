# Full stack for a dev machine (PostgreSQL + Qdrant + Redis reserved for
# future queue use; the backend itself runs with an in-process worker in
# this release, so Redis is optional and not required to start).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: visioniq
      POSTGRES_PASSWORD: visioniq
      POSTGRES_DB: visioniq
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visioniq"]
      interval: 5s
      timeout: 5s
      retries: 10
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrantdata:/qdrant/storage
    ports:
      - "6333:6333"
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://visioniq:visioniq@postgres:5432/visioniq
      QDRANT_URL: http://qdrant:6333
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    volumes:
      - backend_storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
volumes:
  pgdata:
  qdrantdata:
  backend_storage:
